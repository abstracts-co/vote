<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2028 elections</title>
<style>

    --border: #2c2b27; --border-strong: #3d3b34; --accent: #f6c38a; --accent-fill: #f0a04b;
    --land: #33312c; --edge: #0e0e0d; --edge-hot: #ffffff;
    --i1: #f3cf94; --i2: #e9a94c; --i3: #c97f18; --d1: #7fb0e6; --d2: #3f86d6; --d3: #1f5fb4; --r1: #f0a596; --r2: #e0604c; --r3: #b4301f;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.5), 0 14px 36px rgb(0 0 0 / 0.6);
  }
}
* { box-sizing: border-box; }

h3 { margin: 0 0 3px; font-size: 12px; font-weight: 650; color: var(--text-3); }

.meter .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
.mrow { display: grid; grid-template-columns: 62px 30px minmax(0, 1fr) 30px; gap: 6px; align-items: center; font-size: 13px; padding: 3px 0; }

.mhead { font-size: 13px; font-weight: 650; padding-top: 6px; }

.legend i[data-p="D"] { background: var(--d3); } .legend i[data-p="R"] { background: var(--r3); } .legend i[data-c="a"] { background: var(--accent-fill); } .legend i[data-c="m"] { background: var(--text-3); }
.seats { display: flex; gap: 3px; padding: 2px 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 5px; align-items: baseline; padding: 4px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
.chip b { color: var(--text); font-weight: 700; font-size: 13px; }
.cres { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 50px; gap: 8px; align-items: center; padding: 5px 0; font-size: 13px; }
.cres small { display: block; color: var(--text-3); font-size: 12px; }
.cres .lean { margin: 0; grid-column: auto; }
.cres .num { text-align: right; font-weight: 700; }
.cres .num[data-p="D"] { color: var(--d3); } .cres .num[data-p="R"] { color: var(--r3); }
.fact { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 6px; align-items: start; padding: 5px 0; font-size: 14px; }
.ic { width: 18px; height: 18px; color: var(--text-3); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.stance { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 6px; padding: 8px 0; border-top: 1px solid var(--border); }
.stance b { display: block; font-size: 13px; font-weight: 650; }
.stance div { font-size: 14px; line-height: 1.35; }
.bigname .lean { height: 12px; margin-top: 8px; }
.pullq { font-size: 15px; line-height: 1.35; }
details > summary { font-size: 14px; }
.winbody { overflow-x: hidden; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; }
.btns:empty { display: none; }
.btn { display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 550; }
.btn:active, .pick:active { transform: scale(0.97); }
.pick { display: grid; width: 100%; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 0 9px; align-items: baseline; text-align: left; padding: 8px 0; min-height: 40px; }
.pick + .pick { border-top: 1px solid var(--border); }
.pick b { font-weight: 650; }
.pick .sub { grid-column: 2 / 4; font-size: 13px; color: var(--text-3); }
.pick .say { grid-column: 2 / 4; font-size: 14px; color: var(--text); padding-top: 3px; }
.st { font-size: 12px; color: var(--text-2); }
.st[data-s="filed"] { color: var(--accent); font-weight: 650; }
.dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; background: var(--text-3); }
.dot[data-p="D"] { background: var(--d3); } .dot[data-p="R"] { background: var(--r3); }

</style>

<main id="app">

  <div class="stage"><canvas class="gl" role="img" aria-label="United States map"></canvas><div class="tags"></div><button class="icon reset" data-reset aria-label="Reset camera" title="Reset camera" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button><div class="powerslot"></div><div class="card"></div><div class="winslot"></div></div>
  <div class="phoneslot"></div>

</main>
<script src="data.js"></script>
<script src="map.js"></script>
<script>
const { DATA, SHAPES } = window.ELECTION;
const app = document.getElementById('app');
const q = (s) => app.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return 'source'; } };
const safe = (u) => (/^https:\/\//.test(u || '') ? u : '');
const src = (u) => (Array.isArray(u) ? src(u[0]) : safe(u) ? ` <a class="src" href="${esc(u)}" target="_blank" rel="noopener" title="${esc(host(u))}" aria-label="Source: ${esc(host(u))}">↗</a>` : '');
const day = (d) => (d ? new Date(`${d}T12:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }) : '');
const shortDay = (d) => (d ? new Date(`${d}T12:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }) : '');
const ICON = {
  list: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  full: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  shrink: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
};
const STATUS = { filed: 'Filed', considering: 'Considering', ruled_out: 'Said no', unstated: "Hasn't said" };
const ISSUES = [['economy_taxes', 'Economy'], ['health_care', 'Health care'], ['immigration', 'Immigration'], ['foreign_policy', 'Foreign policy'], ['signature', 'Signature issue']];
const BLURB = {
  now: 'Where power stands today, with states colored by their 2026 House vote.',
  president: 'Who holds the presidency and who may run in 2028.',
  primaries: 'Which states vote first in the 2028 primaries, and when.',
  senate: 'The Senate seats on the ballot in 2028, and who holds each one.',
  governor: "The governor's seats on the ballot in 2028, and who holds each one.",
};
const TABS = [['now', 'Now'], ['president', 'President'], ['primaries', 'Primaries'], ['senate', 'Senate'], ['governor', 'Governor']];
function phone0() { return matchMedia('(max-width: 559px)').matches; }
const partyKey = (p) => (p.party?.[0] === 'D' ? 'D' : p.party?.[0] === 'R' ? 'R' : 'O');
const last = (n) => (/Van Hollen|Cortez Masto/.exec(n)?.[0] ?? n.replace(/ (Jr|Sr)\.?$/, '').split(' ').at(-1));
const byState = (list) => Object.fromEntries(list.map((x) => [x.state, x]));
const senate = byState(DATA.senate), gov = byState(DATA.governors);
const shape = Object.fromEntries(SHAPES.map((s) => [s.abbr, s]));
const personNamed = (n) => DATA.people.find((p) => p.name === n);
const ui = { tab: 'now', stack: phone0() ? [] : [{ kind: 'list' }], party: 'all', issue: '', hover: '' };
const phone = () => matchMedia('(max-width: 559px)').matches;
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const openState = () => [...ui.stack].reverse().find((p) => p.kind === 'state')?.id ?? '';
const marginTone = (w, m) => `--${w.toLowerCase()}${m < 5 ? 1 : m < 15 ? 2 : 3}`;
const tone = (a) => {
  if (openState()) return '--land';
  if (ui.tab === 'now' || ui.tab === 'president') { const m = DATA.colors[a]; return m ? `--${m.winner.toLowerCase()}${m.margin_pct < 5 ? 1 : m.margin_pct < 15 ? 2 : 3}` : '--land'; }
  if (ui.tab === 'senate' || ui.tab === 'governor') { const s = (ui.tab === 'senate' ? senate : gov)[a]; return s ? (s.party === 'D' ? '--d3' : s.party === 'R' ? '--r3' : '--accent-fill') : '--land'; }
  const d = DATA.calendar.dem.some((c) => c.state === a), r = DATA.calendar.gop.some((c) => c.state === a);
  return d && r ? '--accent-fill' : d ? '--d3' : r ? '--r3' : '--land';
};
const rise = (a) => {
  if (openState()) return 2;
  if (ui.tab === 'now' || ui.tab === 'president') return 3 + Math.sqrt(DATA.electoral[a] ?? 3) * 5;
  if (ui.tab === 'senate') return senate[a] ? 26 : 3;
  if (ui.tab === 'governor') return gov[a] ? 26 : 3;
  const d = DATA.calendar.dem.findIndex((c) => c.state === a), r = DATA.calendar.gop.findIndex((c) => c.state === a);
  const order = Math.min(d < 0 ? 9 : d, r < 0 ? 9 : r);
  return order === 9 ? 3 : 40 - order * 5;
};
const labelsFor = (a) => {
